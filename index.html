
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoBro Name Generator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 26px 14px;
  background: radial-gradient(circle at top, #35216b, #10152d 70%);
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 620px;
  margin: auto;
  padding: 28px;
  background: #171d3a;
  border: 2px solid #8058f1;
  border-radius: 24px;
  box-shadow: 0 0 40px #8e4cf044;
}

h1 {
  text-align: center;
  color: #4ce9f7;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #c6bde8;
}

label {
  display: block;
  margin: 16px 0 7px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 13px;
  background: #293052;
  color: white;
  border: 1px solid #8b7db9;
  border-radius: 9px;
  font-size: 16px;
}

.result {
  margin-top: 24px;
  padding: 23px 14px;
  text-align: center;
  border: 2px solid #37e4f4;
  background: #0d122a;
  border-radius: 16px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 1.4px;
  color: #bda6ff;
}

#name {
  font-size: clamp(24px, 5vw, 35px);
  font-weight: 900;
  margin: 15px 0;
  overflow-wrap: anywhere;
}

#persona {
  font-size: 21px;
  font-weight: bold;
  color: #52e5ef;
  margin: 12px 0;
}

#description {
  color: #e1dcfa;
  line-height: 1.5;
  min-height: 42px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

button {
  flex: 1;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #48dce8;
  color: #0a1630;
}

.secondary {
  background: #a878ff;
  color: #10152d;
}

footer {
  text-align: center;
  color: #b5afd0;
  font-size: 12px;
  margin-top: 20px;
}

@media (max-width: 430px) {
  main { padding: 20px; }
  .actions { flex-direction: column; }
}
</style>

<label for="gender">Choose your name style</label>

</select>

<label for="investment">
  Where would you invest or collect?
</label>
<select id="investment">

  <option>Ethereum</option>
  <option>Dogecoin</option>
  <option>Solana</option>
  <option>XRP</option>
  <option>Shiba Inu</option>
  <option>Memecoins</option>
  <option>Stablecoins</option>
  <option>Bored Ape Yacht Club</option>
  <option>CryptoPunks</option>
  <option>Pudgy Penguins</option>
  <option>Azuki</option>
  <option>Doodles</option>
</select>

<label for="role">ESC level or role</label>
<select id="role">
  <option>GQ</option>
  <option>ESC 1</option>
  <option>ESC 2</option>
  <option>ESC 3</option>
  <option>Supervisor</option>
  <option>Manager</option>
  <option>Pro</option>
</select>

<label for="tenure">Time at the company</label>
<select id="tenure">
  <option value="Under 2">Under 2 years</option>
  <option value="2">2 years</option>
  <option value="3">3 years</option>
  <option value="4">4 years</option>
  <option value="5">5 years</option>
  <option value="6+">6+ years</option>
</select>

<section class="result" aria-live="polite">
  <div class="eyebrow">CRYPTO IDENTITY UNLOCKED</div>
  <div id="name"></div>
  <div id="persona"></div>
  <div id="description"></div>
</section>

<div class="actions">
  <button class="primary" onclick="generate()">
    🚀 Generate Another
  </button>
  <button class="secondary" onclick="copyIdentity()">
    📋 Copy Identity
  </button>
</div>

<footer>
  2026 Boot Camp • Just for fun • Not financial advice
</footer>
</main>

let previousFirst = "";
let previousMiddle = "";
let previousPersonality = -1;

// Pick a random option, avoiding the previous one.
function pick(items, previous) {
  const options = items.length > 1
    ? items.filter(item => item !== previous)
    : items;

  return options[Math.floor(Math.random() * options.length)];
}

// GENERATE IDENTITY
function generate() {
  const gender = document.getElementById("gender").value;
  const investment = document.getElementById("investment").value;
  const role = document.getElementById("role").value;
  const tenure = document.getElementById("tenure").value;

  const first = pick(firstNames[gender], previousFirst);
  const middle = pick(cryptoNames[investment], previousMiddle);

  previousFirst = first;
  previousMiddle = middle;

  const last = roleNames[role] + tenureNames[tenure];
  const fullName = first + " " + middle + " " + last;

  let id = Math.floor(Math.random() * personalities.length);

  // Avoid repeating the same personality immediately.
  if (id === previousPersonality) {
    id = (id + 1) % personalities.length;
  }

  previousPersonality = id;

  document.getElementById("name").textContent = fullName;
  document.getElementById("persona").textContent =
    personalities[id][0];
  document.getElementById("description").textContent =
    '"' + personalities[id][1] + '"';
}

// COPY NAME AND PERSONALITY
async function copyIdentity() {
  const name = document.getElementById("name").textContent;
  const persona = document.getElementById("persona").textContent;
  const description =
    document.getElementById("description").textContent;

  const identity = name + "\n" + persona + "\n" + description;

  try {
    await navigator.clipboard.writeText(identity);
    alert("Crypto identity copied!");
  } catch (error) {
    window.prompt("Copy your crypto identity:", identity);
  }
}

// Generate a name when the page opens.
