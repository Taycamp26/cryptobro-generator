// GENERATE A COMPLETE CRYPTO IDENTITY
function generate() {
  const gender = document.getElementById("gender").value;
  const investment = document.getElementById("investment").value;
  const role = document.getElementById("role").value;
  const tenure = document.getElementById("tenure").value;

  // Random first and middle names.
  const first = pickDifferent(
    firstNames[gender], previousFirst
  );
  const middle = pickDifferent(
    cryptoNames, previousMiddle
  );

  previousFirst = first;
  previousMiddle = middle;

  // Last name encodes role and tenure.
  const last = roleNames[role] + tenureNames[tenure];
  const fullName = first + " " + middle + " " + last;

  // Random personality, avoiding immediate repeats.
  let personalityId = Math.floor(
    Math.random() * personalities.length
  );

  if (personalityId === previousPersonality) {
    personalityId =
      (personalityId + 1) % personalities.length;
  }

  previousPersonality = personalityId;

  // Investment-specific fortune with random twist.
  let fortune = "";
  let fortuneAttempts = 0;

  do {
    fortune =
      random(investmentFortunes[investment]) + " " +
      random(fortuneTwists);
    fortuneAttempts++;
  } while (
    fortune === previousFortune &&
    fortuneAttempts < 10
  );

  previousFortune = fortune;

  // TaxHawk superpower combines role and tenure.
  const roleLabel = role;
  const tenureLabel = tenure === "Under 2"
    ? "less than 2 years"
    : tenure === "6+"
      ? "6 or more years"
      : tenure + " years";

  let superpower = "";
  let superpowerAttempts = 0;

  do {
    superpower =
      "As a " + roleLabel + " with " +
      tenureLabel + " at TaxHawk, " +
      random(rolePowers[role]) + ". " +
      random(tenurePowers[tenure]) + " " +
      random(superpowerFinishers);

    superpowerAttempts++;
  } while (
    superpower === previousSuperpower &&
    superpowerAttempts < 10
  );

  previousSuperpower = superpower;

  // Display the completed identity.
  document.getElementById("name").textContent =
    fullName;

  document.getElementById("persona").textContent =
    personalities[personalityId][0];

  document.getElementById("description").textContent =
    '"' + personalities[personalityId][1] + '"';

  document.getElementById("fortune").textContent =
    fortune;

  document.getElementById("superpower").textContent =
    superpower;
}

    await navigator.clipboard.writeText(identity);
    alert("Crypto identity copied! Paste it into Teams.");
  } catch (error) {
    window.prompt("Copy your identity:", identity);
  }
}

// Generate the first identity when the page opens.
generate();
</script>
